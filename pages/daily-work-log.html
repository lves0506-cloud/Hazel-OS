
<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Work Log</title>

<link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">Hazel OS</div>

        <nav>

            <div class="nav-item"
                onclick="location.href='../index.html'">
                🏠 Home
            </div>

            <div class="nav-item"
                onclick="location.href='career.html'">
                💼 Career
            </div>

            <div class="nav-item active">
                ✍️ Daily Work Log
            </div>

            <div class="nav-item"
                onclick="alert('일상은 Build 006 예정 🌿')">
                🌿 일상
            </div>

            <div class="nav-item"
                onclick="location.href='settings.html'">
                ⚙️ Settings
            </div>

        </nav>

    </aside>

    <div class="container">

    <h1>Daily Work Log</h1>

    <p>오늘의 업무를 자유롭게 기록하세요.</p>

    <div class="log-box">

        <label>오늘 날짜</label>
        <input type="date" id="date">

        <label>근무 시간</label>

        <div class="time-select">

            <button type="button" id="amBtn" class="time-btn active-time"
                 onclick="selectTime('오전')">
                 오전
             </button>

             <button type="button" id="pmBtn" class="time-btn"
                 onclick="selectTime('오후')">
                 오후
            </button>

        </div>

        <label>오늘 한 일</label>

        <textarea
        placeholder="나한테 말하듯 편하게 적어줘."></textarea>

        
<button class="save-btn" onclick="saveLog()">Save</button>

<div class="log-list">

    <div class="log-list-header">

        
        <!-- Career Brain -->

        <div id="brainCard" class="brain-card">

            <div class="brain-header">

                <span id="brainIcon" class="brain-icon">
                    🧠
                </span>

                <span>
                    Career Brain
              </span>

            </div>

             </div>

            <div id="brainStatus">

              Ready to analyze.

             </div>

            <div class="brain-steps">

                 <div id="step1">⬜ Analyzing</div>
                 <div id="step2">⬜ Extracting Skills</div>
                 <div id="step3">⬜ Finding Related</div>
                 <div id="step4">⬜ Connected</div>

             </div>

             <div id="brainResult"></div>

        </div>

        <h2>Saved Logs</h2>

        <div>

            <button class="sort-btn"
            onclick="renderLogs('new')">
                최신순
            </button>

            <button class="sort-btn"
            onclick="renderLogs('old')">
                오래된순
            </button>

        </div>

    </div>

    <div id="logContainer">

    </div>

</div>
    </div>

</div>
</div>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/daily-log.js"></script>


<!-- Edit Modal -->

<div id="editModal" class="modal">

    <div class="modal-content">

        <h2>Edit Daily Log</h2>

        <label>날짜</label>
        <input type="date" id="editDate">

        <label>근무 시간</label>

        <div class="time-select">

            <button type="button" id="editAm" class="time-btn active-time"
            onclick="selectEditTime('오전')">
                오전
            </button>

            <button type="button" id="editPm" class="time-btn"
            onclick="selectEditTime('오후')">
                오후
            </button>

        </div>

        <label>오늘 한 일</label>

        <textarea id="editText" rows="6"></textarea>

        <div class="modal-buttons">

            <button class="cancel-btn" onclick="closeModal()">
                Cancel
            </button>

            <button class="save-btn" onclick="saveEdit()">
                Save
            </button>

        </div>

    </div>

</div>

<!-- Detail Modal -->

<div id="detailModal" class="modal">

    <div class="modal-content">

        <div class="detail-header">

            <h2 id="detailTitle">Daily Log</h2>

             <button class="close-btn"
                 onclick="closeDetailModal()">
                 ✕
             </button>

        </div>

        <small id="detailEdited"></small>

        <div class="log-tags">
            <span id="detailTag1" class="tag">#AI</span>
            <span id="detailTag2" class="tag"></span>
            <span id="detailTag3" class="tag"></span>
        </div>

        <div class="brain-result">

            <b>AI Summary</b>

            <p id="detailSummary"></p>

        </div>

        <div>

            <b>Original Log</b>

            <p id="detailText"></p>

        </div>

        <div class="modal-buttons">

            <button class="icon-btn"
            onclick="editCurrentLog()">
                ✏️ 수정
            </button>

            <button class="icon-btn delete"
            onclick="deleteCurrentLog()">
                🗑️ 삭제
            </button>

            <button class="cancel-btn"
            onclick="closeDetailModal()">
                닫기
            </button>

        </div>

    </div>

</div>
</body>

</html>
